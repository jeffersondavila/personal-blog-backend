# ---------------------------------------------------------------------------
# Alembic — migraciones de esquema de personal-blog-backend
#
# `sqlalchemy.url` NO se define aqui a proposito: la URL de conexion lleva
# credenciales y este archivo se versiona. `alembic/env.py` la obtiene de la
# configuracion tipada, que la lee de variables de entorno (requisito S-10).
#
# Uso:
#   alembic upgrade head          aplica todas las migraciones pendientes
#   alembic downgrade -1          revierte la ultima
#   alembic current               revision aplicada en la base de datos
#   alembic history --verbose     historial completo
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .

# Nombre de archivo: fecha + numero correlativo + descripcion. Ordena
# cronologicamente en el listado del directorio y evita colisiones.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Zona horaria de la marca temporal de los archivos generados. El proyecto
# trabaja en UTC (api-contracts.md, seccion 1).
timezone = UTC

# Longitud maxima del fragmento descriptivo del nombre de archivo.
truncate_slug_length = 40

# Separador de rutas de la configuracion. `os` usa el del sistema operativo y
# evita el modo heredado, que divide por espacios, comas y dos puntos.
path_separator = os

sqlalchemy.url =

# ---------------------------------------------------------------------------
# Log de la herramienta. No afecta al log de la aplicacion.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
