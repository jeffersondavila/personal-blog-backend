[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-blog-backend"
version = "0.1.0"
description = "API del blog personal. Fundacion FastAPI (Task/005)."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "jeffersondavila" }]

# Versiones fijadas de forma exacta: la reproducibilidad es un requisito del
# proyecto (S-09 en non-functional-requirements.md).
#
# **Este archivo es la unica fuente manual de dependencias del backend.**
# `requirements.lock` (ejecucion) y `requirements-dev.lock` (ejecucion +
# desarrollo) se GENERAN desde aqui: llevan las transitivas completas, hashes
# `--hash=sha256:...` y resolucion fija para Linux x86_64 y CPython 3.12.
# El Dockerfile instala desde `requirements.lock` con `--require-hashes`.
#
# Historia: hasta `Task/020` existian ademas `requirements.txt` y
# `requirements-dev.txt`, que repetian a mano estas mismas dependencias
# directas sin transitivas ni hashes. Eran una segunda fuente manual que ya
# habia divergido —`Task/005.6` corrigio un comentario que los llamaba *lock*—,
# asi que `Task/020` los sustituyo por los dos *locks* generados y cerro R-14.
#
# Regenerar los locks: README seccion 5.1.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
    # Almacenamiento de objetos compatible con S3 (`Task/010`, decision D-010-A).
    # Un unico SDK para MinIOStorage y S3Storage: MinIO implementa el protocolo
    # S3, y el SDK propio de MinIO arrastraria pycryptodome y argon2-cffi al
    # artefacto de Lambda para codigo que alli nunca se ejecuta (P-07, S-09).
    "boto3==1.43.82",
    # Decodificacion, validacion real y miniaturas de imagen (`Task/010`).
    # No se implementa un parser de JPEG/PNG propio.
    "pillow==12.3.0",
    # Hash de contrasenas con Argon2id (`Task/011`, decision D-011-F). Es la
    # recomendacion vigente de OWASP y aporta verificacion y deteccion de
    # rehash; escribir la serializacion de sal y parametros a mano sobre
    # `hashlib.scrypt` seria criptografia propia sin necesidad.
    #
    # `Task/010` rechazo el SDK de MinIO precisamente porque arrastraba este
    # paquete "para codigo que alli nunca se ejecuta". Aqui es el codigo que
    # SI se ejecuta en cada inicio de sesion: la regla es la misma.
    "argon2-cffi==25.1.0",
    # Analisis de `multipart/form-data` (`Task/012`, decision D-012-W). Es la
    # unica dependencia nueva de la tarea y la exige FastAPI para leer un
    # archivo subido: sin ella, `UploadFile` no se puede declarar.
    #
    # La alternativa evaluada era recibir el cuerpo crudo y llevar el nombre del
    # archivo en un parametro de consulta. Se descarto: `original_filename` es
    # `NOT NULL` y acabaria en la URL —y por tanto en los logs de acceso—, y el
    # `alt_text` tendria que viajar por el mismo sitio.
    #
    # **Impacto en Lambda: minimo.** Es Python puro, sin extension compilada, y
    # ocupa ~164 KB (P-07). No arrastra dependencias transitivas.
    "python-multipart==0.0.32",
    # Cota sobre una dependencia TRANSITIVA de starlette, no una dependencia
    # nueva: `anyio` ya entraba por starlette y esta instalado desde `Task/005`.
    #
    # Motivo medido en `Task/020` sobre Linux y Python 3.12.14:
    #
    # | anyio | starlette | `python -W error -c "import starlette.testclient"` |
    # | --- | --- | --- |
    # | 4.15.1 | 1.6.0 | `DeprecationWarning` -> **falla** |
    # | 4.15.0 | 1.6.0 | `DeprecationWarning` -> **falla** |
    # | 4.14.2 | 1.6.0 | **exit 0**, sin advertencia |
    #
    # `anyio` 4.15.0 marco obsoleto el alias `anyio.abc.BlockingPortal`, y
    # `starlette.testclient` lo sigue usando en su linea 53. Con la resolucion
    # sin cota, `pytest -W error` no llega ni a recolectar: el import falla.
    # `starlette` 1.6.0 es la ultima version publicada, asi que **no existe una
    # correccion aguas arriba** que adoptar hoy.
    #
    # La cota va en `[project].dependencies`, no en el extra `dev`, a proposito:
    # si solo cubriera desarrollo, la imagen ejecutaria un `anyio` distinto del
    # que validan las pruebas. Ambos *locks* deben resolver la misma version.
    #
    # **Como se retira:** cuando starlette publique una version que use
    # `anyio.from_thread.BlockingPortal`, se elimina esta cota, se regeneran los
    # dos *locks* y se comprueba que `pytest -W error` sigue en verde.
    #
    # El proyecto **no silencia la advertencia**: no se anade `filterwarnings`.
    # Es el mismo criterio que aplico `Task/005` al sustituir `httpx` por
    # `httpx2` en lugar de callar el `StarletteDeprecationWarning`.
    "anyio<4.15",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Cliente exigido por `starlette.testclient` desde Starlette 1.3.
    #
    # Subido de 2.10.0 a 2.12.0 en `Task/020`, no por comodidad: `pip-audit`
    # sobre el lock de desarrollo devolvio tres vulnerabilidades conocidas de
    # 2.10.0, todas con correccion publicada.
    #
    # | Identificador | CVSS 3.1 | Corregida en |
    # | --- | --- | --- |
    # | CVE-2026-84379 — inyeccion de cabeceras de parte en multipart | 5.3 | 2.11.0 |
    # | CVE-2026-84380 — Content-Length y Transfer-Encoding a la vez | 5.6 | 2.11.0 |
    # | CVE-2026-84382 — descompresion sin acotar la memoria | **7.5** | 2.12.0 |
    #
    # `httpx2` no viaja a produccion: no aparece en `requirements.lock`, no
    # entra en la imagen ni en el artefacto de Lambda, y las tres exigen un
    # servidor hostil, que en la suite no existe. Aun asi se corrige: la
    # politica de S-09 no admite ignorar un hallazgo que TIENE arreglo, y una
    # excepcion documentada seguiria siendo una excepcion.
    "httpx2==2.12.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    # Tipos de boto3 para mypy en modo estricto. Solo tipado: no entra en la
    # imagen ni en el artefacto de despliegue.
    "boto3-stubs[s3]==1.43.82",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — lint y formato (CONTRIBUTING.md seccion 5)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "ANN", # flake8-annotations
    "RUF", # reglas propias de ruff
]
ignore = [
    "ANN401", # Any explicito: necesario en los manejadores genericos de error
]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, `assert` es la forma esperada de comprobar (S101) y las
# credenciales son ficticias por definicion (S105, S106).
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
# `scripts` es codigo del propio repositorio, no una dependencia: sin declararlo,
# isort lo ordenaria entre los paquetes de terceros (`Task/022`).
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy — tipado estatico (M-02)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["app", "tests", "alembic/env.py"]
exclude = "^(\\.venv|alembic/versions)/"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest y cobertura
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requiere PostgreSQL en marcha (se omite si no esta disponible)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # Cuerpo de un metodo de `Protocol`. No es codigo que pueda ejecutarse: el
    # `...` solo existe porque Python exige un cuerpo. Quien implementa el
    # protocolo si se ejecuta, y se prueba. Contarlo como linea sin cubrir
    # empujaria a escribir una prueba que instancia el protocolo, que no
    # comprobaria nada (BACKEND_TESTING_STRATEGY.md seccion 12).
    '''^\s*\.\.\.$''',
]
