[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-blog-backend"
version = "0.1.0"
description = "API del blog personal. Fundacion FastAPI (Task/005)."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "jeffersondavila" }]

# Versiones fijadas de forma exacta: la reproducibilidad es un requisito del
# proyecto (S-09 en non-functional-requirements.md).
#
# `requirements.txt` repite estas mismas dependencias DIRECTAS porque el
# Dockerfile instala desde el sin necesitar el proyecto completo. **No es un
# lock**: no contiene dependencias transitivas ni hashes. El bloqueo
# reproducible completo, resuelto en Linux, corresponde a `Task/020-CI-Backend`
# y sigue registrado como riesgo R-14. Corregido en `Task/005.6`: este
# comentario afirmaba que requirements.txt ya era ese lock.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",
    # Almacenamiento de objetos compatible con S3 (`Task/010`, decision D-010-A).
    # Un unico SDK para MinIOStorage y S3Storage: MinIO implementa el protocolo
    # S3, y el SDK propio de MinIO arrastraria pycryptodome y argon2-cffi al
    # artefacto de Lambda para codigo que alli nunca se ejecuta (P-07, S-09).
    "boto3==1.43.82",
    # Decodificacion, validacion real y miniaturas de imagen (`Task/010`).
    # No se implementa un parser de JPEG/PNG propio.
    "pillow==12.3.0",
    # Hash de contrasenas con Argon2id (`Task/011`, decision D-011-F). Es la
    # recomendacion vigente de OWASP y aporta verificacion y deteccion de
    # rehash; escribir la serializacion de sal y parametros a mano sobre
    # `hashlib.scrypt` seria criptografia propia sin necesidad.
    #
    # `Task/010` rechazo el SDK de MinIO precisamente porque arrastraba este
    # paquete "para codigo que alli nunca se ejecuta". Aqui es el codigo que
    # SI se ejecuta en cada inicio de sesion: la regla es la misma.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # Cliente exigido por `starlette.testclient` desde Starlette 1.3.
    "httpx2==2.10.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
    # Tipos de boto3 para mypy en modo estricto. Solo tipado: no entra en la
    # imagen ni en el artefacto de despliegue.
    "boto3-stubs[s3]==1.43.82",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — lint y formato (CONTRIBUTING.md seccion 5)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "ANN", # flake8-annotations
    "RUF", # reglas propias de ruff
]
ignore = [
    "ANN401", # Any explicito: necesario en los manejadores genericos de error
]

[tool.ruff.lint.per-file-ignores]
# En las pruebas, `assert` es la forma esperada de comprobar (S101) y las
# credenciales son ficticias por definicion (S105, S106).
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy — tipado estatico (M-02)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["app", "tests", "alembic/env.py"]
exclude = "^(\\.venv|alembic/versions)/"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest y cobertura
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requiere PostgreSQL en marcha (se omite si no esta disponible)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # Cuerpo de un metodo de `Protocol`. No es codigo que pueda ejecutarse: el
    # `...` solo existe porque Python exige un cuerpo. Quien implementa el
    # protocolo si se ejecuta, y se prueba. Contarlo como linea sin cubrir
    # empujaria a escribir una prueba que instancia el protocolo, que no
    # comprobaria nada (BACKEND_TESTING_STRATEGY.md seccion 12).
    '''^\s*\.\.\.$''',
]
